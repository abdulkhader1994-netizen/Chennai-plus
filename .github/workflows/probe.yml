name: Probe near me
on:
  push:
    paths: ["scripts/probe-near.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-near.mjs
      - run: |
          git config user.name "chennai-plus-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/probe.json; git commit -m "Probe results"; git pull --rebase; git push
