name: Check rentals tab
on:
  push:
    paths: ["scripts/check-rentals.mjs"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-rentals.mjs
      - run: |
          git config user.name "chennai-plus-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/rentals-check.json; git commit -m "Rentals check"; git pull --rebase; git push
