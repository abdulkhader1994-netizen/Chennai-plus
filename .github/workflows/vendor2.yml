name: Fetch 3D addons and catalogs
on:
  push:
    paths: [".github/workflows/vendor2.yml"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          B=https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm
          for f in loaders/GLTFLoader.js loaders/RGBELoader.js loaders/DRACOLoader.js utils/BufferGeometryUtils.js postprocessing/EffectComposer.js postprocessing/RenderPass.js postprocessing/UnrealBloomPass.js postprocessing/OutputPass.js postprocessing/ShaderPass.js postprocessing/MaskPass.js postprocessing/Pass.js shaders/CopyShader.js shaders/LuminosityHighPassShader.js shaders/OutputShader.js libs/draco/gltf/draco_decoder.js libs/draco/gltf/draco_wasm_wrapper.js libs/draco/gltf/draco_decoder.wasm; do
            mkdir -p assets/lib/jsm/$(dirname $f); curl -fsSL $B/$f -o assets/lib/jsm/$f || echo "FAIL $f" >> fails.txt
          done
          mkdir -p assets/meta assets/models
          curl -fsSL "https://api.polyhaven.com/assets?t=hdris" -o assets/meta/hdris.json
          curl -fsSL "https://api.polyhaven.com/assets?t=textures" -o assets/meta/textures.json
          curl -fsSL "https://api.polyhaven.com/assets?t=models" -o assets/meta/models.json
          curl -fsSL https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb -o assets/models/CarConcept.glb || echo "FAIL carconcept" >> fails.txt
          curl -fsSL https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/ferrari.glb -o assets/models/ferrari.glb || echo "FAIL ferrari" >> fails.txt
          ls -laR assets/lib/jsm assets/models assets/meta > assets/meta/listing.txt; cat fails.txt >> assets/meta/listing.txt 2>/dev/null
          git config user.name "chennai-plus-bot"; git config user.email "actions@users.noreply.github.com"
          git add assets; git commit -m "Add three.js addons, model samples and asset catalogs" || true; git pull --rebase; git push
