name: Fetch libraries
on:
  push:
    paths: [".github/workflows/vendor.yml"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/lib
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js -o assets/lib/three.module.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js -o assets/lib/cannon-es.js
          ls -la assets/lib
          git config user.name "chennai-plus-bot"; git config user.email "actions@users.noreply.github.com"
          git add assets/lib; git commit -m "Add three.js r160 and cannon-es 0.20" || true; git pull --rebase; git push
