name: Fetch libraries
on:
  push:
    paths: [".github/workflows/vendor.yml"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/lib
          curl -fsSL https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js -o assets/lib/matter.min.js || curl -fsSL https://unpkg.com/matter-js@0.19.0/build/matter.min.js -o assets/lib/matter.min.js
          ls -la assets/lib; head -c 120 assets/lib/matter.min.js
          git config user.name "chennai-plus-bot"; git config user.email "actions@users.noreply.github.com"
          git add assets/lib/matter.min.js; git commit -m "Add Matter.js 0.19.0" || true; git pull --rebase; git push
