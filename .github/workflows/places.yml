name: Update Chennai places
on:
  schedule:
    - cron: "17 2,14 * * *"   # twice a day; categories under 5 days old are skipped
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-places.mjs"
permissions:
  contents: write
concurrency:
  group: places
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-places.mjs
      - name: Save places
        run: |
          git config user.name "chennai-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places
          git diff --cached --quiet || (git commit -m "Update places" && git pull --rebase && git push)
