name: Update Chennai news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/fuel.json"
      - "data/content-config.json"
      - "scripts/**"
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - run: node scripts/fetch-rates.mjs
      - run: node scripts/fetch-content.mjs
      - run: node scripts/fetch-movies.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Save updates
        run: |
          git config user.name "chennai-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/rates.json; for f in data/movies.json data/content.json; do if [ -f $f ]; then git add $f; fi; done
          git diff --cached --quiet || (git commit -m "Update news, rates and movies" && git pull --rebase && git push)
