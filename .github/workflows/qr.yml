name: Make QR code
on:
  push:
    paths: [".github/workflows/qr.yml"]
permissions:
  contents: write
jobs:
  qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p assets
          npx -y qrcode@1.5.4 -o assets/qr.png -w 1000 -m 2 -e M -d 1a1006ff -l ffffffff "https://abdulkhader1994-netizen.github.io/Chennai-plus/"
          git config user.name "chennai-plus-bot"; git config user.email "actions@users.noreply.github.com"
          git add assets/qr.png; git commit -m "Add app QR code"; git pull --rebase; git push
