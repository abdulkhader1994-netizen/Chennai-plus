name: Write Chennai Plus news
on:
  schedule:
    - cron: "40 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    paths:
      - "scripts/write-news.mjs"
permissions:
  contents: write
concurrency:
  group: write-news
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/write-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_PER_RUN: ${{ vars.NEWS_PER_RUN }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Save articles
        run: |
          git config user.name "chennai-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json news feed.xml sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Chennai Plus news: new articles" && git pull --rebase && git push)
