<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6e1423">
<meta name="description" content="Chennai Plus: weather, alerts, news, events, food, offers and places near you.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chennai Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&family=Hind+Madurai:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell, sticky header, scrolling sections, fixed bottom tab bar */
:root{
  --bg:#fffcf4; --surface:#ffffff; --ink:#2b1d12; --muted:#7a6a58; --line:#efe5d0;
  --sea:#8a5f0e; --seaDeep:#5e1520; --marigold:#c9952b; --jasmine:#fbf3dc;
  --alert:#b3261e; --alertBg:#fdeceb; --ok:#3d6b2a;
  --grad:linear-gradient(120deg,#6e1423 0%,#8f2a1e 50%,#a77418 100%);
  --t1b:#fbf0d4; --t1f:#8a5f0e; --t2b:#f9e6e8; --t2f:#8a1c2b; --t3b:#fdebdc; --t3f:#b4500f; --t4b:#e8f2e4; --t4f:#3d6b2a; --t5b:#f4e9e2; --t5f:#8a4a2a;
  --display:"Baloo Thambi 2","Hind Madurai",system-ui,sans-serif;
  --body:"Hind Madurai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100a; --surface:#201810; --ink:#f6efe0; --muted:#b3a48c; --line:#352a1c;
  --sea:#e2b85a; --seaDeep:#3a0f16; --marigold:#e2b85a; --jasmine:#2a2112;
  --alert:#ff8a80; --alertBg:#3a1714; --ok:#8fcf72;
  --grad:linear-gradient(120deg,#5a0f1c 0%,#7a2418 50%,#8d6012 100%);
  --t1b:#33270f; --t1f:#f0c96a; --t2b:#3a1a1f; --t2f:#ff9aa8; --t3b:#3a2414; --t3f:#ffb07a; --t4b:#1d2e17; --t4f:#a7dc8c; --t5b:#33221a; --t5f:#e6b090; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100a; --surface:#201810; --ink:#f6efe0; --muted:#b3a48c; --line:#352a1c;
  --sea:#e2b85a; --seaDeep:#3a0f16; --marigold:#e2b85a; --jasmine:#2a2112;
  --alert:#ff8a80; --alertBg:#3a1714; --ok:#8fcf72;
  --grad:linear-gradient(120deg,#5a0f1c 0%,#7a2418 50%,#8d6012 100%);
  --t1b:#33270f; --t1f:#f0c96a; --t2b:#3a1a1f; --t2f:#ff9aa8; --t3b:#3a2414; --t3f:#ffb07a; --t4b:#1d2e17; --t4f:#a7dc8c; --t5b:#33221a; --t5f:#e6b090; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#6e1423}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--grad);color:#fff;box-shadow:0 4px 18px rgba(110,20,35,.22);border-bottom:2px solid #e2b85a;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;letter-spacing:.2px}
.brand span{color:#f4d27a}
.sub{font-size:12px;opacity:.75}
.lang{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 12px;font:600 13px var(--body);cursor:pointer}
.lang:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
main>*,section,.list,.row .txt{min-width:0}
html,body{overflow-x:hidden;max-width:100%}
main{grid-template-columns:minmax(0,1fr);width:100%}
.app{width:100%}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:grid;gap:22px}
.demo{font-size:12px;color:var(--muted);background:var(--jasmine);border:1px dashed var(--marigold);border-radius:10px;padding:8px 12px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 8px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* weather */
.weather{background:var(--grad);color:#fff;border-radius:20px;box-shadow:0 10px 28px rgba(110,20,35,.25);border:1px solid rgba(226,184,90,.5);padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.weather::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 2px,transparent 2px 14px)}
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.temp{font-family:var(--display);font-size:56px;font-weight:800;line-height:.9}
.temp small{font-size:22px;opacity:.8}
.wmeta{font-size:13px;opacity:.9;text-align:right}
.hours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hours div{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}
.hours b{display:block;font-size:15px}
/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--alertBg);border-left:4px solid var(--alert);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.alert.info{background:var(--surface);border-left-color:var(--marigold)}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--alert);white-space:nowrap}
.alert.info .pill{color:#8a5f0e}
:root[data-theme="dark"] .alert.info .pill{color:var(--marigold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert.info .pill{color:var(--marigold)}}
.alert p{margin:0;font-size:14px;min-width:0}
.alert time{display:block;font-size:12px;color:var(--muted)}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .txt{min-width:0;flex:1}
.row h3{font-size:15px;font-weight:600;margin:0;line-height:1.35}
.row .meta{font-size:12.5px;color:var(--muted)}
.badge{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--sea);background:var(--bg);font-size:13px;line-height:1.05;text-align:center}
.date{background:var(--jasmine);color:var(--ink)}
.date b{display:block;font-size:18px;color:var(--marigold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 13px var(--body);white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.offer{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.off{font-family:var(--display);font-weight:800;font-size:22px;color:#3a2408;background:linear-gradient(135deg,#f4d27a,#c9952b);border-radius:12px;padding:6px 10px;line-height:1;text-align:center;min-width:64px}
.off small{display:block;font-size:11px;font-weight:700}
.code{font:600 12px ui-monospace,monospace;border:1px dashed var(--muted);border-radius:6px;padding:1px 6px;color:var(--ink)}
.see{background:none;border:0;color:var(--sea);font:600 13px var(--body);cursor:pointer;padding:0}
.row .badge{background:var(--t1b);color:var(--t1f)}
.row .badge.date{background:var(--jasmine);color:var(--ink)}
.list,.offer{box-shadow:0 2px 10px rgba(120,80,20,.07)}
.hot{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,72%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.hcard{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(120,80,20,.07)}
.hband{background:var(--grad);color:#fff;padding:14px 14px 12px;display:grid;gap:6px;position:relative}
.hband.k-place{background:linear-gradient(135deg,#8f2a1e,#c9952b)}
.hband.k-event{background:linear-gradient(135deg,#5e1520,#8a1c2b)}
.hband.k-food{background:linear-gradient(135deg,#a77418,#d9a441)}
.htag{justify-self:start;background:rgba(255,255,255,.92);color:#5e1520;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.hband h3{margin:0;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;text-wrap:balance}
.hbody{padding:10px 14px 12px;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.hbody .why{color:var(--ink);font-size:13.5px}
.heat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--alert)}
.heat i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#c9952b,#b3261e);flex:none}
.flame{width:20px;height:20px;vertical-align:-3px;stroke:var(--alert);fill:none;stroke-width:1.9;stroke-linejoin:round;margin-right:4px}
.rates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(120,80,20,.07);min-width:0}
.rate .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-variant-numeric:tabular-nums}
.rline span{font-size:13px;color:var(--muted)}
.rline b{font-family:var(--display);font-size:19px;font-weight:700}
.up{color:var(--alert);font-size:12px;font-weight:600}.down{color:var(--ok);font-size:12px;font-weight:600}
.loc{display:flex;align-items:center;gap:8px;background:var(--jasmine);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.loc svg{width:18px;height:18px;stroke:var(--alert);fill:none;stroke-width:2;flex:none}
.loc select{margin-left:auto;font:600 13px var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:48%}
.nchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.nchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 2px;font:600 11px/1.2 var(--body);text-align:center;cursor:pointer;display:grid;justify-items:center;gap:4px}
.nchip svg{width:22px;height:22px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nchip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.nchip[aria-pressed="true"] svg{stroke:#fff}
.nchip:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.dist{text-align:right;flex:none;display:grid;gap:4px;justify-items:end}
.dist b{font-variant-numeric:tabular-nums;font-size:14px}
.go{font:600 12px var(--body);color:var(--sea);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.open{color:var(--ok);font-weight:600}.closed{color:var(--alert);font-weight:600}
.ocard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(120,80,20,.07)}
.ocard .txt{min-width:0}
.brandtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 8px;margin-bottom:3px;background:var(--t1b);color:var(--t1f)}
.ocard h3{margin:0;font-size:15px;line-height:1.35}
.getdeal{background:linear-gradient(135deg,#f4d27a,#c9952b);color:#3a2408;text-decoration:none;font:700 13px var(--body);border-radius:999px;padding:8px 14px;white-space:nowrap}
.getdeal:focus-visible{outline:2px solid var(--alert);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:2px 0 0}
.mv{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,42%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.poster{scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,80,20,.07)}
.pimg{aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff}
.pimg .rel{align-self:flex-start;background:rgba(0,0,0,.35);border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px}
.pimg h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.05;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.pinfo{padding:8px 10px 10px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.pinfo b{color:var(--ink);font-size:13px}
.nlink{color:inherit;text-decoration:none}.nlink:active{background:var(--bg)}
.hband.k-Temples{background:linear-gradient(135deg,#6e1423,#b4500f)}
.hband.k-Beaches{background:linear-gradient(135deg,#1d4f6e,#c9952b)}
.hband.k-Heritage{background:linear-gradient(135deg,#5e1520,#8a5f0e)}
.hband.k-Nature{background:linear-gradient(135deg,#2c4a24,#8a8a1e)}
.hband.k-Shopping{background:linear-gradient(135deg,#8a1c2b,#d9540b)}
.hband.k-Day.trips,.hband.k-Daytrips{background:linear-gradient(135deg,#3a0f16,#a77418)}
.plan{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:0 2px 10px rgba(120,80,20,.07)}
.pstep{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.pstep:first-child{border-top:0}
.pstep .when{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--marigold);padding-top:2px}
.pstep b{display:block;font-size:15px}.pstep span{font-size:13px;color:var(--muted)}
.besttime{background:var(--jasmine);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.back{background:none;border:0;color:var(--sea);font:600 14px var(--body);padding:0;cursor:pointer;justify-self:start}
.ex-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}
.stag{display:inline-block;vertical-align:middle;margin-left:8px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1.5px rgba(244,210,122,.6)}
.tab .ic{display:grid;place-items:center;width:58px;height:30px;border-radius:999px;transition:background .2s}
.tab[aria-selected="true"] .ic{background:var(--t1b)}
.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qbtn{background:none;border:0;padding:0;display:grid;justify-items:center;gap:6px;font:600 11.5px/1.2 var(--body);color:var(--ink);cursor:pointer;text-align:center}
.qbtn .qi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(120,80,20,.08)}
.qbtn svg{width:24px;height:24px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qbtn:focus-visible .qi{outline:2px solid var(--marigold);outline-offset:2px}
.loccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;box-shadow:0 2px 10px rgba(120,80,20,.07)}
.lrow{display:flex;align-items:center;gap:12px}
.lpin{width:40px;height:40px;border-radius:12px;background:var(--t2b);display:grid;place-items:center;flex:none}
.lpin svg{width:20px;height:20px;stroke:var(--alert);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ltxt{min-width:0;flex:1}.ltxt b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.lsel{font:600 13px var(--body);color:var(--sea);background:var(--t1b);border:0;border-radius:999px;padding:7px 10px;max-width:42%}
.gpsbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px solid var(--marigold);background:transparent;color:var(--ink);border-radius:12px;padding:10px;font:600 14px var(--body);cursor:pointer}
.gpsbtn svg{width:18px;height:18px;stroke:var(--marigold);fill:none;stroke-width:2;stroke-linecap:round}
.gpsbtn:focus-visible,.ncat:focus-visible,.dirbtn:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.ncats{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 6px;scrollbar-width:none;margin:14px 0 6px}
.ncats::-webkit-scrollbar{display:none}
.ncat{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 10px;font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.ncat svg{width:18px;height:18px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ncat[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}.ncat[aria-pressed="true"] svg{stroke:#fff}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px 8px;font-size:13px;color:var(--muted)}
.rhead b{color:var(--ink);font-size:15px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.prow .meta{font-size:12.5px;color:var(--muted)}
.near1{display:inline-block;font:700 10px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ok);background:var(--t4b);border-radius:999px;padding:1px 7px;margin-bottom:3px}
.pd{display:grid;justify-items:end;gap:6px;text-align:right}
.pd b{font-size:14px;font-variant-numeric:tabular-nums}.pd small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.dirbtn{display:inline-flex;align-items:center;gap:5px;background:var(--grad);color:#fff;text-decoration:none;border-radius:999px;padding:6px 11px;font:600 12px var(--body)}
.dirbtn svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}}
.tripcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 2px 10px rgba(120,80,20,.07);position:relative}
.tin{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.tin input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--body);padding:12px 0;outline:none}
.tin:focus-within{border-color:var(--marigold)}
.tdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}.tdot.to{background:var(--alert);border-radius:2px}

 return `<section><h2><svg class="flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>What's hot in Chennai${contentLive?"":`<span class="stag">Sample</span>`}</h2>
 <div class="chips">${Object.keys(L).map(k=>`<button class="chip" data-h="${k}" aria-pressed="${k===hotF}">${L[k]}</button>`).join("")}</div>

 bus:'<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M7 21v-3M17 21v-3"/>',

const OSMQ={
 petrol:'nwr["amenity"="fuel"]',
 station:'node["railway"~"^(station|halt)$"];node["station"="subway"];node["public_transport"="station"]["railway"]',
 bus:'node["highway"="bus_stop"]',
 hotel:'nwr["tourism"~"^(hotel|guest_house|motel|hostel)$"]',
 food:'nwr["amenity"~"^(restaurant|fast_food)$"]',

let nearC="petrol",nearA="T. Nagar",nearLoc={lat:AREAS["T. Nagar"][0],lng:AREAS["T. Nagar"][1],gps:false},nearState={},nearMsg="";
const km=(a,b,c,d)=>{const R=6371,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const placeCache={};
async function placesFor(cat){if(placeCache[cat])return placeCache[cat];const r=await fetch(`data/places/${cat}.json`);if(!r.ok)throw new Error("no data");const j=await r.json();placeCache[cat]=j.rows;return j.rows}
async function findNear(){
 const key=nearC+"|"+nearLoc.lat.toFixed(3)+","+nearLoc.lng.toFixed(3);
 if(nearState[key]&&nearState[key]!=="loading")return;
 nearState[key]="loading";rerenderNear();
 try{
  const all=await placesFor(nearC);
  let rows=all.map(r=>({name:r[0]||UNNAMED[nearC],info:r[3],la:r[1],lo:r[2],d:km(nearLoc.lat,nearLoc.lng,r[1],r[2])})).filter(r=>r.d<=4).sort((x,y)=>x.d-y.d);
  // prefer named places, but keep unnamed ones if few results
  const named=rows.filter(r=>r.name!==UNNAMED[nearC]);if(named.length>=5)rows=named;
  nearState[key]=rows.slice(0,15);
 }catch(e){nearState[key]="error"}
 rerenderNear();
}
function rerenderNear(){const cur=document.querySelector('.tab[aria-selected="true"]');if(cur&&cur.dataset.v==="near"){const y=window.scrollY;view.innerHTML=nearView();centerCat();window.scrollTo(0,y)}}
function useGPS(){
 if(!navigator.geolocation){nearMsg="Location isn't available on this device. Pick an area instead.";rerenderNear();return}
 nearMsg="Finding your location…";rerenderNear();
 navigator.geolocation.getCurrentPosition(p=>{nearLoc={lat:p.coords.latitude,lng:p.coords.longitude,gps:true};nearMsg="";findNear()},
  ()=>{nearMsg="Location permission was denied. Allow location for Chennai+ in your phone settings, or pick an area.";rerenderNear()},{enableHighAccuracy:true,timeout:15000,maximumAge:120000});
}
function nearView(){
 const key=nearC+"|"+nearLoc.lat.toFixed(3)+","+nearLoc.lng.toFixed(3),st=nearState[key];
 if(st===undefined)setTimeout(findNear,0);
 if((nearC==="bus"||nearC==="station")&&!TR)loadTransit().then(rerenderNear).catch(()=>{});
 const fmt=d=>d<1?Math.round(d*100)*10+" m":d.toFixed(1)+" km";
 const eta=d=>d<=1.2?Math.max(1,Math.round(d*1.3/5*60))+" min walk":"~"+Math.max(3,Math.round(d*1.3/18*60))+" min drive";
 const ic=`<svg viewBox="0 0 24 24" width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">${ICON[nearC]}</svg>`;
 const msgRow=(h,m)=>`<div class="prow" style="grid-template-columns:1fr"><div><h3>${h}</h3><div class="meta">${m}</div></div></div>`;
 const list=st==="error"?msgRow("Couldn't load places","Places for this category are still being prepared, or your internet is off. Tap the category again to retry.")
  :(!st||st==="loading")?[1,2,3].map(()=>`<div class="prow"><div class="badge">${ic}</div><div style="display:grid;gap:8px"><div class="skel" style="width:70%"></div><div class="skel" style="width:45%;height:10px"></div></div><div class="skel" style="width:52px"></div></div>`).join("")
  :st.length===0?msgRow("Nothing found within 4 km","Try another category or change the area.")
  :st.map((r,i)=>`<div class="prow"><div class="badge">${ic}</div><div style="min-width:0">${i===0?`<span class="near1">Nearest</span>`:""}<h3>${esc(r.name)}</h3><div class="meta">${esc(cleanInfo(r.info)||NCAT[nearC])}</div>${(nearC==="bus"||nearC==="station")?routeChips(r.la,r.lo,nearC==="bus"):""}</div><div class="pd"><b>${fmt(r.d)}<small>${eta(r.d)}</small></b><a class="dirbtn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${r.la},${r.lo}" aria-label="Directions to ${esc(r.name)}"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Go</a></div></div>`).join("");
 const n=Array.isArray(st)?st.length:0;
 return `<section><h2>Near me</h2>

 {b:"Swiggy",t:"Flat ₹100 off on biryani orders above ₹399",v:"Till 31 Oct",u:"https://www.swiggy.com"},

 if(!TF||!TT)return `<p class="note">Pick a start and a destination from the suggestions. Tip: bus termini, Metro and railway stations give the best results.</p>`;
 const res=plan(TF,TT);if(res.err)return `<div class="prow" style="grid-template-columns:1fr;border:1px solid var(--line);border-radius:14px"><div><h3>No stop within 600 m of your ${res.err==="from"?"start":"destination"}</h3><div class="meta">Pick a nearby bus stop or station instead.</div></div></div>`;
 const R=TR.routes;const f=o=>trMode==="All"||(trMode==="Bus"?o.legs.every(l=>R[l.rs[0]].m==="bus"):o.legs.some(l=>R[l.rs[0]].m===trMode.toLowerCase()));
 const opts=res.opts.filter(f);
 return opts.length?`<div style="display:grid;gap:10px">${opts.map(optHTML).join("")}</div>`:`<div class="prow" style="grid-template-columns:1fr;border:1px solid var(--line);border-radius:14px"><div><h3>No route with up to one change</h3><div class="meta">Try a bigger stop nearby (a bus terminus or station), another mode, or Google Maps below.</div></div></div>`}
function gmapsTransit(){const q=p=>p?(p.label==="My location"?`${p.la},${p.lo}`:encodeURIComponent(p.label+", Chennai")):"";return `https://www.google.com/maps/dir/?api=1&origin=${q(TF)}&destination=${q(TT)}&travelmode=transit`}
function travelView(){if(!TR)loadTransit().then(()=>{if(view.dataset.v==="travel")go("travel")}).catch(()=>{trMsg="Couldn't load routes. Check your internet and open this screen again.";if(view.dataset.v==="travel")go("travel")});
 return `<section style="display:grid;gap:10px"><button class="back" data-go="home">‹ Home</button><h2 style="margin:0">Bus, train &amp; Metro</h2>
 <div class="tripcard"><div class="tin"><span class="tdot"></span><input id="tfrom" placeholder="From: stop, station or area" autocomplete="off" value="${TF?esc(TF.label):""}" aria-label="From"></div>
 <button class="tswap" id="tswap" aria-label="Swap start and destination"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
 <div class="tin"><span class="tdot to"></span><input id="tto" placeholder="To: where are you going?" autocomplete="off" value="${TT?esc(TT.label):""}" aria-label="To"></div>
 <button class="gpsbtn" id="tgps"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Start from my location</button></div>
 <div id="tsug"></div>
 <div class="chips" style="margin:2px 0 0">${["All","Bus","Train","Metro"].map(c=>`<button class="chip" data-tm="${c}" aria-pressed="${c===trMode}">${c}</button>`).join("")}</div>
 <div id="tres">${travelResults()}</div>
 <a class="getdeal" style="display:block;text-align:center" target="_blank" rel="noopener" id="tgm" href="${gmapsTransit()}">Live timings in Google Maps</a>
 <p class="note">Bus routes from the community <a href="https://mobilitydatabase.org/feeds/gtfs/mdb-3360" target="_blank" rel="noopener" style="color:var(--muted)">Chennai GTFS feed</a>; train and Metro lines from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:var(--muted)">© OpenStreetMap contributors</a>. Routes can change and times are rough estimates, so check before you travel.</p></section>`}
function initTravel(){const sug=document.getElementById("tsug");let which=null;
 const show=(w,q)=>{which=w;q=q.trim().toLowerCase();if(!TRidx||q.length<2){sug.innerHTML="";return}
  const m=TRidx.names.filter(x=>x.n.toLowerCase().includes(q)).sort((a,b)=>(b.n.toLowerCase().startsWith(q)-a.n.toLowerCase().startsWith(q))||b.modes.size-a.modes.size||a.n.length-b.n.length).slice(0,7);
  sug.innerHTML=m.length?`<div class="tsug">${m.map(x=>`<button data-sug="${x.i}"><span>${esc(x.n)}</span><small>${[...x.modes].map(v=>v[0].toUpperCase()+v.slice(1)).join(" · ")}</small></button>`).join("")}</div>`:`<p class="note">No stop matches “${esc(q)}”. Try a shorter name.</p>`};
 const refresh=()=>{document.getElementById("tres").innerHTML=travelResults();document.getElementById("tgm").href=gmapsTransit()};
 ["tfrom","tto"].forEach(id=>{const el=document.getElementById(id);el.addEventListener("input",()=>{if(id==="tfrom")TF=null;else TT=null;trMsg="";show(id,el.value)});el.addEventListener("focus",()=>show(id,el.value))});
 sug.addEventListener("click",e=>{const b=e.target.closest("[data-sug]");if(!b)return;const st=TR.stops[+b.dataset.sug];const p={label:st[0],la:st[1],lo:st[2]};
  if(which==="tfrom")TF=p;else TT=p;document.getElementById(which).value=st[0];sug.innerHTML="";if(which==="tfrom"&&!TT)document.getElementById("tto").focus();refresh()});
 document.getElementById("tswap").addEventListener("click",()=>{[TF,TT]=[TT,TF];document.getElementById("tfrom").value=TF?TF.label:"";document.getElementById("tto").value=TT?TT.label:"";refresh()});
 document.getElementById("tgps").addEventListener("click",()=>{if(!navigator.geolocation){trMsg="Location isn't available on this device.";refresh();return}
  trMsg="Finding your location…";refresh();navigator.geolocation.getCurrentPosition(p=>{TF={label:"My location",la:p.coords.latitude,lo:p.coords.longitude};trMsg="";document.getElementById("tfrom").value="My location";refresh()},()=>{trMsg="Location permission was denied. Type your start stop instead.";refresh()},{enableHighAccuracy:true,timeout:15000,maximumAge:120000})});
}
function routeChips(la,lo,bus){if(!TR)return"";const R=TR.routes,seen=new Set(),out=[];stopsNear(la,lo,bus?0.15:0.12).forEach(([si])=>TRidx.byStop[si].forEach(([ri])=>{const r=R[ri];if((r.m==="bus")!==bus)return;const k=r.m==="bus"?r.ref.split(/\s+/)[0]:lineName(r);if(!seen.has(k)){seen.add(k);out.push(r.m==="bus"?`<span class="lchip">${esc(k)}</span>`:lineChip(r))}}));
 return out.length?`<div class="rchips">${out.slice(0,8).join("")}${out.length>8?`<span class="lchip">+${out.length-8}</span>`:""}</div>`:""}
function rainAlert(){return W&&W.rain?alertHTML({k:"Rain",t:`Rain likely around ${W.rain.at} (${W.rain.p}% chance). Carry an umbrella and avoid low-lying subways.`,w:"Live forecast • Open-Meteo",lvl:"warn"}):""}

const views={
 home:()=>`${weather()}
  <p style="margin:-14px 0 0;font-size:11px;color:var(--muted)">Weather data by <a href="https://open-meteo.com" style="color:var(--muted)">Open-Meteo.com</a></p>
  ${quickSec()}
  ${ratesSec()}
  <section><h2>Alerts</h2>${rainAlert()}${alerts.filter(a=>a.k!=="Rain").map(alertHTML).join("")}</section>
  ${hotSec()}
  ${buzzSec()}
  ${exploreHome()}
  <section><div class="head"><h2>Top news</h2>${more("news")}</div><div class="list">${news.slice(0,3).map(newsRow).join("")}</div></section>
  <section><div class="head"><h2>This week${contentLive?"":`<span class="stag">Sample</span>`}</h2>${more("events")}</div><div class="list">${events.slice(0,2).map(evRow).join("")}</div></section>
  <section><div class="head"><h2>Today's offers${contentLive?"":`<span class="stag">Sample</span>`}</h2>${more("offers")}</div>${onlineCard(online[0])}</section>`,
 near:()=>nearView(),
 explore:()=>exploreView(),
 travel:()=>travelView(),
 news:()=>`${buzzSec(true)}<section><h2>Chennai news</h2>${newsLive?`<p class="note" style="margin:-4px 0 8px">Tap a headline to read the full story on the publisher's site.</p>`:""}<div class="list">${news.map(newsRow).join("")}</div></section>`,
 events:()=>`<section><h2>Events in Chennai${contentLive?"":`<span class="stag">Sample</span>`}</h2><div class="list">${events.map(evRow).join("")}</div></section>`,
 food:(f="All")=>`<section><h2>Top rated near me</h2>
  <p class="note" style="margin:-4px 0 10px">Opens Google Maps with the best-rated places around you, with ratings and reviews.</p>
  <a class="getdeal" style="display:block;text-align:center;margin-bottom:10px" target="_blank" rel="noopener" href="${mapsQ("best restaurants near me")}">Show top-rated restaurants near me</a>
  <div class="nchips" style="grid-template-columns:repeat(4,minmax(0,1fr))">${TOPQ.slice(1).map(([l,q])=>`<a class="nchip" style="text-decoration:none;padding:10px 2px" target="_blank" rel="noopener" href="${mapsQ(q+" near me")}">${l}</a>`).join("")}<a class="nchip" style="text-decoration:none;padding:10px 2px" target="_blank" rel="noopener" href="${mapsQ("best street food near me")}">Street food</a></div></section>
  <section><h2>Chennai's best${contentLive?"":`<span class="stag">Sample</span>`}</h2><p class="note" style="margin:-4px 0 10px">Hand-picked spots. Tap Ratings &amp; map to see Google reviews.</p><div class="chips">${["All","Veg","Biryani","Dessert","Late night"].map(c=>`<button class="chip" data-f="${c}" aria-pressed="${c===f}">${c}</button>`).join("")}</div>
  <div class="list">${food.filter(x=>f==="All"||(x.tag||"").toLowerCase().includes(f.toLowerCase())||(f==="Veg"&&/\bveg\b/i.test(x.m)&&!/non/i.test(x.m))).map(foodRow).join("")}</div></section>`,
 offers:()=>`<section><h2>Online deals${contentLive?"":`<span class="stag">Sample</span>`}</h2>${online.map(onlineCard).join("")}<p class="note">Online deals open the store's own app or website. Offers are set by each store and may change.</p></section>`};

const view=document.getElementById("view");
function go(v,arg){view.dataset.v=v;view.innerHTML=views[v](arg);if(v==="near")centerCat();if(v==="travel")initTravel();document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));window.scrollTo(0,0)}
document.querySelector("nav").addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)go(t.dataset.v)});
view.addEventListener("click",e=>{const q=e.target.closest("[data-q]");if(q){const v=q.dataset.q;if(v.startsWith("near:")){nearC=v.slice(5);go("near")}else go(v);return}const s=e.target.closest("[data-go]");if(s)go(s.dataset.go);const xb=e.target.closest("[data-x]");if(xb){exF=xb.dataset.x;const y=window.scrollY;go("explore");window.scrollTo(0,y);return}const tm=e.target.closest("[data-tm]");if(tm){trMode=tm.dataset.tm;document.querySelectorAll("[data-tm]").forEach(b=>b.setAttribute("aria-pressed",b===tm));document.getElementById("tres").innerHTML=travelResults();return}const nb=e.target.closest("[data-n]");if(nb){nearC=nb.dataset.n;const k=nearC+"|"+nearLoc.lat.toFixed(3)+","+nearLoc.lng.toFixed(3);if(nearState[k]==="error")delete nearState[k];go("near");return}const bz=e.target.closest("[data-b]");if(bz){buzzF=bz.dataset.b;const v=document.querySelector('.tab[aria-selected="true"]').dataset.v,y=window.scrollY;go(v);window.scrollTo(0,y);return}const h=e.target.closest("[data-h]");if(h){hotF=h.dataset.h;const y=window.scrollY;go("home");window.scrollTo(0,y);return}const c=e.target.closest("[data-f]");if(c)go("food",c.dataset.f)});
function setLang(l){lang=l;document.querySelectorAll("[data-t]").forEach(n=>n.textContent=T[l][n.dataset.t]);document.getElementById("lang").textContent=T[l].btn;try{localStorage.setItem("cp-lang",l)}catch(e){}}
document.getElementById("lang").addEventListener("click",()=>setLang(lang==="en"?"ta":"en"));
view.addEventListener("change",e=>{if(e.target.id==="area"&&AREAS[e.target.value]){nearA=e.target.value;nearLoc={lat:AREAS[nearA][0],lng:AREAS[nearA][1],gps:false};nearMsg="";rerenderNear()}});
view.addEventListener("click",e=>{if(e.target.closest("#gps"))useGPS()});
setLang(lang);go("home");loadWeather();loadNews();loadRates();loadMovies();loadContent();loadExplore();setInterval(()=>{loadWeather();loadNews();loadRates();loadMovies();loadContent()},30*60e3);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

<footer style="display:none"></footer>
</body>
