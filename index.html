<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Chennai Plus: weather, alerts, news, events, food and places near you.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chennai Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&family=Hind+Madurai:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell, sticky header, scrolling sections, fixed bottom tab bar */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#2a1a0e; --muted:#6b6b73; --line:#ebebef;
  --sea:#d9480f; --seaDeep:#9a3412; --marigold:#f76707; --jasmine:#fff4e6;
  --alert:#c62828; --alertBg:#fff1f1; --ok:#1e8e4f;
  --grad:linear-gradient(120deg,#ff5f00 0%,#ff8c00 55%,#ffb700 100%);
  --t1b:#ffedd5; --t1f:#c2410c; --t2b:#ffedd5; --t2f:#c2410c; --t3b:#fff4e5; --t3f:#b45309; --t4b:#e8f6ee; --t4f:#1e8e4f; --t5b:#eef2ff; --t5f:#3b5bdb;
  --navbg:rgba(255,255,255,.82); --goldbg:linear-gradient(135deg,#fff7dc,#ffe7a3); --fuelbg:linear-gradient(135deg,#eef3ff,#dde6ff); --page:#fffaf3; --surface2:rgba(255,255,255,.9); --glow1:rgba(255,140,0,.20); --glow2:rgba(255,183,0,.16); --glow3:rgba(255,95,0,.14);
  --display:"Baloo Thambi 2","Hind Madurai",system-ui,sans-serif;
  --body:"Hind Madurai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100b; --surface:#231a12; --ink:#fff4e8; --muted:#bba78f; --line:#3a2c1f;
  --sea:#ff9a3d; --seaDeep:#2a1a0c; --marigold:#ffb347; --jasmine:#2a1c10;
  --alert:#ff7676; --alertBg:#351a1c; --ok:#4ade80;
  --grad:linear-gradient(120deg,#ff5f00 0%,#ff8c00 55%,#ffb700 100%);
  --t1b:#3a2410; --t1f:#ffb36b; --t2b:#3a2410; --t2f:#ffb36b; --t3b:#3a2a14; --t3f:#ffb454; --t4b:#16301f; --t4f:#6ee7a0; --t5b:#1b2540; --t5f:#93b4ff; --navbg:rgba(28,28,32,.82); --goldbg:linear-gradient(135deg,#3a2f12,#2a2210); --fuelbg:linear-gradient(135deg,#1b2540,#151c30); --page:#15100b; --surface2:rgba(35,26,18,.92); --glow1:rgba(255,120,0,.18); --glow2:rgba(255,183,0,.10); --glow3:rgba(255,80,0,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100b; --surface:#231a12; --ink:#fff4e8; --muted:#bba78f; --line:#3a2c1f;
  --sea:#ff9a3d; --seaDeep:#2a1a0c; --marigold:#ffb347; --jasmine:#2a1c10;
  --alert:#ff7676; --alertBg:#351a1c; --ok:#4ade80;
  --grad:linear-gradient(120deg,#ff5f00 0%,#ff8c00 55%,#ffb700 100%);
  --t1b:#3a2410; --t1f:#ffb36b; --t2b:#3a2410; --t2f:#ffb36b; --t3b:#3a2a14; --t3f:#ffb454; --t4b:#16301f; --t4f:#6ee7a0; --t5b:#1b2540; --t5f:#93b4ff; --navbg:rgba(28,28,32,.82); --goldbg:linear-gradient(135deg,#3a2f12,#2a2210); --fuelbg:linear-gradient(135deg,#1b2540,#151c30); --page:#15100b; --surface2:rgba(35,26,18,.92); --glow1:rgba(255,120,0,.18); --glow2:rgba(255,183,0,.10); --glow3:rgba(255,80,0,.12); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;letter-spacing:.2px}
.brand span{color:var(--sea)}
.sub{font-size:12px;opacity:.75}
.lang{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 13px var(--body);cursor:pointer}
.lang:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
main>*,section,.list,.row .txt{min-width:0}
html,body{overflow-x:hidden;max-width:100%}
main{grid-template-columns:minmax(0,1fr);width:100%}
.app{width:100%}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:grid;gap:22px}
.demo{font-size:12px;color:var(--muted);background:var(--jasmine);border:1px dashed var(--marigold);border-radius:10px;padding:8px 12px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 8px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* weather */
.weather{background:var(--grad);color:#fff;border-radius:20px;box-shadow:0 10px 28px rgba(217,45,58,.25);border:1px solid rgba(255,255,255,.2);padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.weather::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 2px,transparent 2px 14px)}
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.temp{font-family:var(--display);font-size:56px;font-weight:800;line-height:.9}
.temp small{font-size:22px;opacity:.8}
.wmeta{font-size:13px;opacity:.9;text-align:right}
.hours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hours div{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}
.hours b{display:block;font-size:15px}
/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--alertBg);border-left:4px solid var(--alert);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.alert.info{background:var(--surface);border-left-color:var(--marigold)}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--alert);white-space:nowrap}
.alert.info .pill{color:#b45309}
:root[data-theme="dark"] .alert.info .pill{color:var(--marigold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert.info .pill{color:var(--marigold)}}
.alert p{margin:0;font-size:14px;min-width:0}
.alert time{display:block;font-size:12px;color:var(--muted)}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .txt{min-width:0;flex:1}
.row h3{font-size:15px;font-weight:600;margin:0;line-height:1.35}
.row .meta{font-size:12.5px;color:var(--muted)}
.badge{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--sea);background:var(--bg);font-size:13px;line-height:1.05;text-align:center}
.date{background:var(--jasmine);color:var(--ink)}
.date b{display:block;font-size:18px;color:var(--marigold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 13px var(--body);white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.offer{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.off{font-family:var(--display);font-weight:800;font-size:22px;color:#ffffff;background:var(--grad);border-radius:12px;padding:6px 10px;line-height:1;text-align:center;min-width:64px}
.off small{display:block;font-size:11px;font-weight:700}
.code{font:600 12px ui-monospace,monospace;border:1px dashed var(--muted);border-radius:6px;padding:1px 6px;color:var(--ink)}
.see{background:none;border:0;color:var(--sea);font:600 13px var(--body);cursor:pointer;padding:0}
.row .badge{background:var(--t1b);color:var(--t1f)}
.row .badge.date{background:var(--jasmine);color:var(--ink)}
.list,.offer{box-shadow:0 2px 10px rgba(20,20,40,.06)}
.hot{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,72%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.hcard{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(20,20,40,.06)}
.hband{background:var(--grad);color:#fff;padding:14px 14px 12px;display:grid;gap:6px;position:relative}
.hband.k-place{background:linear-gradient(135deg,#d92d3a,#d92d3a)}
.hband.k-event{background:linear-gradient(135deg,#1f1f24,#d92d3a)}
.hband.k-food{background:linear-gradient(135deg,#f08c00,#fab005)}
.htag{justify-self:start;background:rgba(255,255,255,.92);color:#1f1f24;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.hband h3{margin:0;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;text-wrap:balance}
.hbody{padding:10px 14px 12px;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.hbody .why{color:var(--ink);font-size:13.5px}
.heat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--alert)}
.heat i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#d92d3a,#e03131);flex:none}
.flame{width:20px;height:20px;vertical-align:-3px;stroke:var(--alert);fill:none;stroke-width:1.9;stroke-linejoin:round;margin-right:4px}
.rates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(20,20,40,.06);min-width:0}
.rate .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-variant-numeric:tabular-nums}
.rline span{font-size:13px;color:var(--muted)}
.rline b{font-family:var(--display);font-size:19px;font-weight:700}
.up{color:var(--alert);font-size:12px;font-weight:600}.down{color:var(--ok);font-size:12px;font-weight:600}
.loc{display:flex;align-items:center;gap:8px;background:var(--jasmine);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.loc svg{width:18px;height:18px;stroke:var(--alert);fill:none;stroke-width:2;flex:none}
.loc select{margin-left:auto;font:600 13px var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:48%}
.nchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.nchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 2px;font:600 11px/1.2 var(--body);text-align:center;cursor:pointer;display:grid;justify-items:center;gap:4px}
.nchip svg{width:22px;height:22px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nchip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.nchip[aria-pressed="true"] svg{stroke:#fff}
.nchip:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.dist{text-align:right;flex:none;display:grid;gap:4px;justify-items:end}
.dist b{font-variant-numeric:tabular-nums;font-size:14px}
.go{font:600 12px var(--body);color:var(--sea);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.open{color:var(--ok);font-weight:600}.closed{color:var(--alert);font-weight:600}
.ocard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,20,40,.06)}
.ocard .txt{min-width:0}
.brandtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 8px;margin-bottom:3px;background:var(--t1b);color:var(--t1f)}
.ocard h3{margin:0;font-size:15px;line-height:1.35}
.getdeal{background:var(--grad);color:#ffffff;text-decoration:none;font:700 13px var(--body);border-radius:999px;padding:8px 14px;white-space:nowrap}
.getdeal:focus-visible{outline:2px solid var(--alert);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:2px 0 0}
.mv{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,42%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.poster{scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(20,20,40,.06)}
.pimg{aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff}
.pimg .rel{align-self:flex-start;background:rgba(0,0,0,.35);border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px}
.pimg h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.05;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.pinfo{padding:8px 10px 10px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.pinfo b{color:var(--ink);font-size:13px}
.nlink{color:inherit;text-decoration:none}.nlink:active{background:var(--bg)}
.hband.k-Temples{background:linear-gradient(135deg,#c92a2a,#f76707)}
.hband.k-Beaches{background:linear-gradient(135deg,#1971c2,#d92d3a)}
.hband.k-Heritage{background:linear-gradient(135deg,#1f1f24,#b45309)}
.hband.k-Nature{background:linear-gradient(135deg,#2b8a3e,#82c91e)}
.hband.k-Shopping{background:linear-gradient(135deg,#d92d3a,#f06595)}
.hband.k-Day.trips,.hband.k-Daytrips{background:linear-gradient(135deg,#343a40,#f08c00)}
.plan{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:0 2px 10px rgba(20,20,40,.06)}
.pstep{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.pstep:first-child{border-top:0}
.pstep .when{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--marigold);padding-top:2px}
.pstep b{display:block;font-size:15px}.pstep span{font-size:13px;color:var(--muted)}
.besttime{background:var(--jasmine);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.back{background:none;border:0;color:var(--sea);font:600 14px var(--body);padding:0;cursor:pointer;justify-self:start}
.ex-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}
.stag{display:inline-block;vertical-align:middle;margin-left:8px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.tab .ic{display:grid;place-items:center;width:58px;height:30px;border-radius:999px;transition:background .2s}
.tab[aria-selected="true"] .ic{background:var(--t1b)}
.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qbtn{background:none;border:0;padding:0;display:grid;justify-items:center;gap:6px;font:600 11.5px/1.2 var(--body);color:var(--ink);cursor:pointer;text-align:center}
.qbtn .qi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,20,40,.07)}
.qbtn svg{width:24px;height:24px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qbtn:focus-visible .qi{outline:2px solid var(--marigold);outline-offset:2px}
.loccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;box-shadow:0 2px 10px rgba(20,20,40,.06)}
.lrow{display:flex;align-items:center;gap:12px}
.lpin{width:40px;height:40px;border-radius:12px;background:var(--t2b);display:grid;place-items:center;flex:none}
.lpin svg{width:20px;height:20px;stroke:var(--alert);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ltxt{min-width:0;flex:1}.ltxt b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.lsel{font:600 13px var(--body);color:var(--sea);background:var(--t1b);border:0;border-radius:999px;padding:7px 10px;max-width:42%}
.gpsbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px solid var(--marigold);background:transparent;color:var(--ink);border-radius:12px;padding:10px;font:600 14px var(--body);cursor:pointer}
.gpsbtn svg{width:18px;height:18px;stroke:var(--marigold);fill:none;stroke-width:2;stroke-linecap:round}
.gpsbtn:focus-visible,.ncat:focus-visible,.dirbtn:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.ncats{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 6px;scrollbar-width:none;margin:14px 0 6px}
.ncats::-webkit-scrollbar{display:none}
.ncat{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 10px;font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.ncat svg{width:18px;height:18px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ncat[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}.ncat[aria-pressed="true"] svg{stroke:#fff}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px 8px;font-size:13px;color:var(--muted)}
.rhead b{color:var(--ink);font-size:15px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.prow .meta{font-size:12.5px;color:var(--muted)}
.near1{display:inline-block;font:700 10px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ok);background:var(--t4b);border-radius:999px;padding:1px 7px;margin-bottom:3px}
.pd{display:grid;justify-items:end;gap:6px;text-align:right}
.pd b{font-size:14px;font-variant-numeric:tabular-nums}.pd small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.dirbtn{display:inline-flex;align-items:center;gap:5px;background:var(--grad);color:#fff;text-decoration:none;border-radius:999px;padding:6px 11px;font:600 12px var(--body)}
.dirbtn svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

function trTree(root){if(lang!=="ta"||!root)return;if(root.nodeType===3){const t=trText(root.nodeValue);if(t!==null)root.nodeValue=t;return}if(root.nodeType!==1)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const ns=[];while(n=w.nextNode())ns.push(n);ns.forEach(n=>{if(n.parentElement&&n.parentElement.closest(".list .row h3,.feat h3,.feat .fmeta + *"))return;const t=trText(n.nodeValue);if(t!==null)n.nodeValue=t});

function banner(k,title,sub,arts){return `<section class="banner" style="background:linear-gradient(135deg,${BANNER[k]})"><div class="bart3">${arts.map((a,i)=>art(a,"b"+i)).join("")}</div><h1>${title}</h1><p>${sub}</p></section>`}
const BRAND={Swiggy:"#fc8019",Zomato:"#e23744",Amazon:"#232f3e",Flipkart:"#2874f0",BookMyShow:"#e5344a"};
function credits(v){const t={home:'Weather: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a> · Movies: TMDB (not endorsed by TMDB) · Gold rate is an estimate',

const newsRow=n=>{const inner=`<div class="ibadge" style="background:rgba(${NEWSTINT[n.c]||"99,102,241"},.14)">${art(NEWSART[n.c]||"city")}</div><div class="txt"><h3>${esc(n.t)}</h3><div class="meta">${esc(n.c)} · ${esc(n.m)}</div></div>`;return n.u?`<a class="row nlink" href="${esc(n.u)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="row">${inner}</div>`};
const newsFeat=n=>{const inner=`<span class="fcat">${esc(n.c)}</span><h3>${esc(n.t)}</h3><div class="fmeta">${esc(n.m)}</div>${art(NEWSART[n.c]||"city","fart")}`;const st=`style="background:linear-gradient(135deg,${NEWSGRAD[n.c]||NEWSGRAD.City})"`;return n.u?`<a class="feat nlink" ${st} href="${esc(n.u)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="feat" ${st}>${inner}</div>`};
const evRow=e=>{const inner=`<div class="dtile"><b>${e.d}</b><span>${esc(e.mo)}</span></div><div class="txt"><h3>${esc(e.t)}</h3><div class="meta">${esc(e.m)}</div></div>${art(EVART[e.c]||"festival","eart")}`;return e.u?`<a class="row erow nlink" href="${esc(e.u)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="row erow">${inner}</div>`};
const mapsQ=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const vegOf=x=>(x.v||((/non-veg/i.test(x.m)?"Non-veg":/\bveg\b/i.test(x.m)?"Veg":""))).toLowerCase();
function foodMatch(x,f){if(f==="All")return true;const v=vegOf(x);if(f==="Veg")return v==="veg"||v==="both";if(f==="Non-veg")return v==="non-veg"||v==="both";return (x.tag||"").trim().toLowerCase()===f.toLowerCase()}
function foodChips(){const out=[["All",food.length]];const veg=food.filter(x=>foodMatch(x,"Veg")).length,non=food.filter(x=>foodMatch(x,"Non-veg")).length;
 if(veg&&veg<food.length)out.push(["Veg",veg]);if(non&&non<food.length)out.push(["Non-veg",non]);
 const cnt=new Map();food.forEach(x=>{const t=(x.tag||"").trim();if(!t)return;const k=t.toLowerCase();const c=cnt.get(k)||[t,0];c[1]++;cnt.set(k,c)});
 const tags=[...cnt.values()].sort((a,b)=>b[1]-a[1]);const big=tags.filter(t=>t[1]>=2);(big.length>=3?big:tags).slice(0,12).forEach(t=>out.push(t));return out}

 return `<section style="display:grid;gap:10px"><button class="back" data-go="home">‹ Home</button>${banner("about","About Chennai","History, culture &amp; what makes Namma Chennai",["heritage","temple","beach"])}</section>
 <section><h2>Chennai at a glance</h2><div class="glance">${ABOUT.glance.map(g=>`<div class="gtile">${art(g.icon)}<small>${esc(L(g,"k"))}</small><b>${esc(L(g,"v"))}</b></div>`).join("")}</div></section>
 <section><h2>How Chennai grew</h2><div class="tline">${ABOUT.timeline.map(e=>`<div class="tl"><div class="ty">${esc(L(e,"y"))}</div><div class="tc"><b>${esc(L(e,"t"))}</b><span>${esc(L(e,"d"))}</span></div></div>`).join("")}</div></section>
 <section><h2>What makes Chennai special</h2><div class="hlgrid">${ABOUT.highlights.map(h=>`<div class="hl">${art(h.art)}<b>${esc(L(h,"t"))}</b><span>${esc(L(h,"d"))}</span></div>`).join("")}</div></section>
`}
function aboutHome(){return `<section><button class="kcard" data-go="about">${art("heritage","kart")}<span><small>Since 1639</small><b>Know your Chennai</b><span>History, culture &amp; what makes it special</span></span><i>›</i></button></section>`}
let REPS=null,repQ="";
async function loadReps(){if(REPS)return;try{const r=await fetch("data/representatives.json");REPS=await r.json();if(view.dataset.v==="reps")go("reps")}catch(e){}}
function repsView(){loadReps();if(!REPS)return `<section><button class="back" data-go="home">‹ Home</button><p class="note">Loading…</p></section>`;
 const q=repQ.trim().toLowerCase();const acs=REPS.acs.filter(a=>!q||(a.ac+" "+a.ac_ta+" "+a.mla+" "+a.ls).toLowerCase().includes(q));
 const asOf=new Date(REPS.asOf+"T00:00").toLocaleDateString(LOC(),{day:"numeric",month:"short",year:"numeric"});
 return `<section style="display:grid;gap:10px"><button class="back" data-go="home">‹ Home</button>${banner("reps","Your MLA &amp; MP","Who represents your area, and how to reach them",["civic","people","paper"])}</section>
 <section><h2>Members of Parliament</h2><div style="display:grid;gap:10px">${REPS.mps.map(m=>`<div class="mpcard"><div class="mphead"><div class="mpav">${art("civic")}</div><div style="min-width:0"><small>${esc(lang==="ta"?m.ls_ta:m.ls)} · Lok Sabha</small><b>${esc(m.name)}</b><span class="party">${esc(m.party)} · ${esc(REPS.parties[m.party]||"")}</span></div></div>
  <div class="mpacts"><a class="mpbtn" href="tel:${m.phone.replace(/\s/g,"")}">${art("people","mi")}Call office<small>${esc(m.phone)}</small></a><a class="mpbtn" href="mailto:${esc(m.email)}">${art("paper","mi")}Email<small>${esc(m.email)}</small></a></div>
  <div class="mpacs"><small>Assembly areas</small>${m.acs.map(a=>`<span>${esc(a)}</span>`).join("")}</div></div>`).join("")}</div></section>
 <section><h2>Your MLA</h2><div class="tin" style="margin-bottom:10px"><svg viewBox="0 0 24 24" width="18" height="18" style="stroke:var(--muted);fill:none;stroke-width:2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="repq" placeholder="Search your constituency, e.g. Mylapore" value="${esc(repQ)}" autocomplete="off" aria-label="Search constituency"></div>
 <div class="list">${acs.length?acs.map(a=>`<div class="row"><div class="ibadge" style="background:var(--t1b)">${art("civic")}</div><div class="txt"><div class="eyebrow">${esc(lang==="ta"?a.ac_ta:a.ac)}</div><h3>${esc(a.mla)}</h3><div class="meta">MLA · ${esc(a.party)} · ${esc(a.ls)}</div>${a.role?`<div class="meta" style="color:var(--sea);font-weight:600">${esc(L(a,"role"))}</div>`:""}</div></div>`).join(""):`<div class="row"><div class="txt"><h3>No constituency matches</h3><div class="meta">Try another spelling, or check the Election Commission link below.</div></div></div>`}</div>
 <a class="bigcta" style="margin-top:12px" target="_blank" rel="noopener" href="https://electoralsearch.eci.gov.in/">${art("pin")}<span><b>Not sure of your constituency?</b><small>Find it with your voter ID on the Election Commission site</small></span><i>›</i></a>
 <a class="bigcta" target="_blank" rel="noopener" href="https://www.assembly.tn.gov.in/">${art("civic")}<span><b>MLA contact details</b><small>Tamil Nadu Legislative Assembly website</small></span><i>›</i></a>
 <p class="note">Updated ${asOf}. MP contacts are from the official Lok Sabha website.</p></section>`}
function repsHome(){return `<section><button class="kcard" data-go="reps" style="background:linear-gradient(135deg,#431407,#9a3412 55%,#ea580c)">${art("civic","kart")}<span><small>Lok Sabha &amp; Assembly</small><b>Your MLA &amp; MP</b><span>Find who represents your area and contact them</span></span><i>›</i></button></section>`}
function rainAlert(){return W&&W.rain?alertHTML({k:"Rain",t:`Rain likely around ${W.rain.at} (${W.rain.p}% chance). Carry an umbrella and avoid low-lying subways.`,w:"Live forecast • Open-Meteo",lvl:"warn"}):""}

const views={
 home:()=>`${weather()}
  ${festCard()}
  ${quickSec()}
  ${ratesSec()}
  <section><h2>Alerts</h2>${rainAlert()||`<div class="alert info"><span class="pill">OK</span><p>No alerts right now<time>Rain and city alerts will show up here.</time></p></div>`}</section>
  ${hotSec()}
  ${buzzSec()}
  ${exploreHome()}
  ${aboutHome()}
  ${repsHome()}
  ${rentHome()}
  <section><div class="head"><h2>Top news</h2>${more("news")}</div><div class="list">${news.slice(0,3).map(newsRow).join("")}</div></section>
  <section><div class="head"><h2>This week${contentLive?"":`<span class="stag">Sample</span>`}</h2>${more("events")}</div><div class="list">${events.slice(0,2).map(evRow).join("")}</div></section>`,
 near:()=>nearView(),
 explore:()=>exploreView(),
 travel:()=>travelView(),
 festival:()=>festView(),
 rent:()=>rentView(),
 about:()=>aboutView(),
 reps:()=>repsView(),
 news:()=>`${banner("news","Chennai news","Fresh headlines every 30 minutes",["paper","film","rain"])}${news.length?`<section>${newsFeat(news[0])}</section>`:""}${buzzSec(true)}<section><h2>Latest</h2><div class="list">${news.slice(1).map(newsRow).join("")}</div></section>`,
 events:()=>`${banner("events","Events","Concerts, comedy, markets &amp; more",["ticket","music","festival"])}<section><h2>Coming up${contentLive?"":`<span class="stag">Sample</span>`}</h2><div class="list">${events.map(evRow).join("")}</div></section>`,
 food:(f="All")=>`${banner("food","Food","Chennai’s tastiest spots",["dosa","biryani","coffee"])}<section>
  <a class="bigcta" target="_blank" rel="noopener" href="${mapsQ("best restaurants near me")}">${art("star")}<span><b>Top rated near me</b><small>Best-rated restaurants around you</small></span><i>›</i></a>
  <div class="ftiles">${[["Biryani","best biryani","biryani"],["Tiffin","best tiffin idli dosa","dosa"],["Veg meals","best veg meals restaurant","veg"],["Seafood","best seafood restaurant","fish"],["Cafes","best cafe","coffee"],["Desserts","best dessert shop","dessert"],["Late night","late night restaurants open now","latenight"],["Street food","best street food","streetfood"]].map(([l,q,a])=>`<a class="ftile" target="_blank" rel="noopener" href="${mapsQ(q+" near me")}">${art(a)}<span>${l}</span></a>`).join("")}</div></section>
  <section><h2>Chennai's best${contentLive?"":`<span class="stag">Sample</span>`}</h2><div class="chips">${foodChips().map(([c,n])=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${c===f}">${esc(c)}${n?` <small class="cnt">${n}</small>`:""}</button>`).join("")}</div>
  <div class="list">${food.filter(x=>foodMatch(x,f)).map(foodRow).join("")}</div></section>`,};

const view=document.getElementById("view");
new MutationObserver(ms=>{if(lang!=="ta")return;ms.forEach(m=>m.addedNodes.forEach(trTree))}).observe(view,{childList:true,subtree:true});
function go(v,arg){view.dataset.v=v;view.innerHTML=views[v](arg)+credits(v);if(v==="near")centerCat();if(v==="travel")initTravel();if(v==="festival")requestAnimationFrame(startFW);if(v==="reps"){const q=document.getElementById("repq");if(q)q.addEventListener("input",()=>{repQ=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{const pos=q.selectionStart;go("reps");const n=document.getElementById("repq");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}},300)})}if(v==="rent"){const q=document.getElementById("rq");if(q)q.addEventListener("input",()=>{rentF.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{const pos=q.selectionStart;go("rent");const n=document.getElementById("rq");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}},350)})}document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));window.scrollTo(0,0)}
document.querySelector("nav").addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)go(t.dataset.v)});
view.addEventListener("click",e=>{const q=e.target.closest("[data-q]");if(q){const v=q.dataset.q;if(v.startsWith("near:")){nearC=v.slice(5);go("near")}else go(v);return}const s=e.target.closest("[data-go]");if(s)go(s.dataset.go);const xb=e.target.closest("[data-x]");if(xb){exF=xb.dataset.x;const y=window.scrollY;go("explore");window.scrollTo(0,y);return}const rf=e.target.closest("[data-rf]");if(rf){rentF[rf.dataset.rf]=rf.dataset.rv;const y=scrollY;go("rent");scrollTo(0,y);return}const tm=e.target.closest("[data-tm]");if(tm){trMode=tm.dataset.tm;document.querySelectorAll("[data-tm]").forEach(b=>b.setAttribute("aria-pressed",b===tm));document.getElementById("tres").innerHTML=travelResults();return}const nb=e.target.closest("[data-n]");if(nb){nearC=nb.dataset.n;const k=nearC+"|"+nearLoc.lat.toFixed(3)+","+nearLoc.lng.toFixed(3);if(nearState[k]==="error")delete nearState[k];go("near");return}const bz=e.target.closest("[data-b]");if(bz){buzzF=bz.dataset.b;const v=document.querySelector('.tab[aria-selected="true"]').dataset.v,y=window.scrollY;go(v);window.scrollTo(0,y);return}const h=e.target.closest("[data-h]");if(h){hotF=h.dataset.h;const y=window.scrollY;go("home");window.scrollTo(0,y);return}const c=e.target.closest("[data-f]");if(c)go("food",c.dataset.f)});
function setLang(l){const changed=l!==lang;lang=l;document.documentElement.lang=l;if(changed&&view.dataset.v){const y=window.scrollY;go(view.dataset.v);window.scrollTo(0,y)}else trTree(view);document.querySelectorAll("[data-t]").forEach(n=>n.textContent=T[l][n.dataset.t]);document.getElementById("lang").textContent=T[l].btn;try{localStorage.setItem("cp-lang",l)}catch(e){}}
document.getElementById("lang").addEventListener("click",()=>setLang(lang==="en"?"ta":"en"));
view.addEventListener("change",e=>{if(e.target.id==="area"&&AREAS[e.target.value]){nearA=e.target.value;nearLoc={lat:AREAS[nearA][0],lng:AREAS[nearA][1],gps:false};nearMsg="";rerenderNear()}});
view.addEventListener("click",e=>{if(e.target.closest("#gps"))useGPS();if(e.target.closest("#hideclosed")){hideClosed=!hideClosed;rerenderNear()}});
(function(){const sp=document.getElementById("splash");if(!sp)return;if(lang==="ta"){const t=document.getElementById("sptag");if(t)t.textContent="நம்ம ஊரு, எல்லாம் ஒரே இடத்தில்"}
 const t0=performance.now();const hide=()=>{const wait=Math.max(0,1300-(performance.now()-t0));setTimeout(()=>{sp.classList.add("hide");setTimeout(()=>sp.remove(),600)},wait)};
 if(document.readyState==="complete")hide();else window.addEventListener("load",hide);setTimeout(hide,2600)})();
setLang(lang);go("home");loadWeather();loadNews();loadRates();loadMovies();loadContent();loadExplore();loadFestivals();loadCfg().then(loadRent);setInterval(()=>{loadWeather();loadNews();loadRates();loadMovies();loadContent()},30*60e3);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!reloaded){reloaded=true;location.reload()}})}
</script>

<footer style="display:none"></footer>
</body>
